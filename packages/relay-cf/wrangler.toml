name = "agentlobbies"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MIN_CLIENT_VERSION = "0.1.0"
PUBLIC_URL = "https://agentlobbies.workers.dev"
JWT_KID = "k1"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyDurableObject"]

[[d1_databases]]
binding = "DB"
database_name = "agentlobbies"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations/d1"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "agentlobbies-archive"

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CODE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["*/10 * * * *"]

# Secrets (wrangler secret put): JWT_PRIVATE_KEY, JWT_PUBLIC_KEYS, IP_HASH_SALT
