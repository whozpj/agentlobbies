name = "agentlobbies"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MIN_CLIENT_VERSION = "0.2.0"
PUBLIC_URL = "https://agentlobbies.agentlobbies-relay-cf.workers.dev"
JWT_KID = "k1"
GITHUB_API_URL = "https://api.github.com"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyDurableObject"]

[[d1_databases]]
binding = "DB"
database_name = "agentlobbies"
database_id = "4ad35dee-bbca-4dd4-b65c-a298b97c9a31"
migrations_dir = "migrations/d1"

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "CODE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["*/10 * * * *"]

# Secrets (wrangler secret put): JWT_PRIVATE_KEY, JWT_PUBLIC_KEYS, IP_HASH_SALT

# Used by the daemon, MCP, and CLI integration tests, which all connect from 127.0.0.1.
[env.test]
vars = { MIN_CLIENT_VERSION = "0.1.0", PUBLIC_URL = "http://localhost", JWT_KID = "k1", CREATE_LOBBY_HOURLY_LIMIT = "10000", GITHUB_API_URL = "https://api.github.com" }
durable_objects.bindings = [{ name = "LOBBY", class_name = "LobbyDurableObject" }]
d1_databases = [{ binding = "DB", database_name = "agentlobbies", database_id = "00000000-0000-0000-0000-000000000000", migrations_dir = "migrations/d1" }]
ratelimits = [
  { name = "CREATE_LIMITER", namespace_id = "1001", simple = { limit = 10000, period = 60 } },
  { name = "CODE_LIMITER", namespace_id = "1002", simple = { limit = 10000, period = 60 } },
]
