name = "agentlobbies"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# agentlobbies.com is the site and API. The old workers.dev address stays on for installs from before
# the domain: its API keeps working, and people opening it in a browser are sent to agentlobbies.com.
routes = [{ pattern = "agentlobbies.com", custom_domain = true }]
workers_dev = true

[vars]
MIN_CLIENT_VERSION = "0.4.0"
PUBLIC_URL = "https://agentlobbies.com"
JWT_KID = "k1"
GITHUB_API_URL = "https://api.github.com"
GITHUB_URL = "https://github.com"
GITHUB_CLIENT_ID = "Ov23liFoL6Ih3Aj5vPwc"

# The hosted dashboard. Its scripts and styles are served directly; pages go through the Worker, which
# sends visitors of the old address to agentlobbies.com and serves everything else from here.
[assets]
directory = "../dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/assets/*"]

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDurableObject"

[[durable_objects.bindings]]
name = "USER"
class_name = "UserDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserDurableObject"]

[[d1_databases]]
binding = "DB"
database_name = "agentlobbies"
database_id = "4ad35dee-bbca-4dd4-b65c-a298b97c9a31"
migrations_dir = "migrations/d1"

[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "INVITE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["*/10 * * * *"]

# Workers Logs: errors and request logs, kept by Cloudflare for a few days.
[observability]
enabled = true

# Secrets (wrangler secret put): JWT_PRIVATE_KEY, JWT_PUBLIC_KEYS, IP_HASH_SALT, GITHUB_CLIENT_SECRET,
# and optionally ADMIN_TOKEN, which enables POST /v1/admin/suspend.

# Used by the daemon, MCP, and CLI integration tests, which all connect from 127.0.0.1.
[env.test]
routes = [] # never the real domain
vars = { MIN_CLIENT_VERSION = "0.1.0", PUBLIC_URL = "http://localhost", JWT_KID = "k1", CREATE_LOBBY_HOURLY_LIMIT = "10000", GITHUB_API_URL = "https://api.github.com", GITHUB_URL = "https://github.com", GITHUB_CLIENT_ID = "test-client" }
durable_objects.bindings = [{ name = "LOBBY", class_name = "LobbyDurableObject" }, { name = "USER", class_name = "UserDurableObject" }]
d1_databases = [{ binding = "DB", database_name = "agentlobbies", database_id = "00000000-0000-0000-0000-000000000000", migrations_dir = "migrations/d1" }]
ratelimits = [
  { name = "CREATE_LIMITER", namespace_id = "1001", simple = { limit = 10000, period = 60 } },
  { name = "INVITE_LIMITER", namespace_id = "1002", simple = { limit = 10000, period = 60 } },
]
