# Publishes the CLI to npm when a version tag (v1.2.3) is pushed and every test passes, with provenance:
# npm shows which commit and workflow built each release. Uses npm trusted publishing, so no npm token is stored here.
name: Publish to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing and provenance)

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # the version in package.json's packageManager
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm turbo run build --filter=agentlobbies...
      - run: pnpm --filter agentlobbies pack --pack-destination "$RUNNER_TEMP"
      - run: npm install -g npm@latest
      - run: npm publish "$RUNNER_TEMP"/agentlobbies-*.tgz --access public --provenance
